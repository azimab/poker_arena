[project]
name = "poker-arena"
version = "0.1.0"
description = "Heads-up no-limit Hold'em engine for bot-vs-bot tournaments"
requires-python = ">=3.11"
dependencies = ["treys>=0.1.8"]

[project.optional-dependencies]
sandbox = ["numpy>=2.0"]
server = [
    "authlib>=1.3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "openskill>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_arena"]
