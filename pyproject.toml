[project]
name = "poker-arena"
version = "0.1.0"
description = "Heads-up no-limit Hold'em engine for bot-vs-bot tournaments"
requires-python = ">=3.11"
dependencies = ["treys>=0.1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_arena"]
