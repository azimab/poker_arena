<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poker-arena</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="arena()" x-init="init()">
  <div id="header">
    <div class="inner">
      <a class="logo" href="#/">poker<span>&spades;</span>arena</a>
      <a href="#/" :class="{ on: navOn('leaderboard') }">Leaderboard</a>
      <a href="#/bots" :class="{ on: navOn('bots') }">Bots</a>
      <a href="#/tournaments" :class="{ on: navOn('tournaments') }">Tournaments</a>
      <template x-if="user">
        <a href="#/submit" :class="{ on: navOn('submit') }">My bots</a>
      </template>
      <template x-if="user">
        <a href="#/play" :class="{ on: navOn('play') }">Play</a>
      </template>
      <span class="right">
        <template x-if="user">
          <span>signed in as <strong x-text="user"></strong> &middot; <a href="#" @click.prevent="logout()">log out</a></span>
        </template>
        <template x-if="!user">
          <a href="/login">Log in with GitHub</a>
        </template>
      </span>
    </div>
  </div>

  <div id="page">
    <p class="error" x-show="error" x-text="error"></p>

    <template x-if="route === 'leaderboard'">
      <section>
        <h2>Leaderboard</h2>
        <p class="lead">Heads-up no-limit Hold'em bots, ranked by skill rating (&mu; &minus; 3&sigma;) from nightly round-robins.</p>
        <table>
          <thead><tr><th class="num">#</th><th>Bot</th><th>Owner</th><th class="num">Rating</th><th class="num hide-sm">&mu;</th><th class="num hide-sm">&sigma;</th></tr></thead>
          <tbody>
            <template x-for="(row, i) in data ?? []" :key="row.bot_id">
              <tr>
                <td class="num" x-text="i + 1"></td>
                <td><a :href="'#/bots/' + row.bot_id" x-text="row.name"></a></td>
                <td x-text="row.username"></td>
                <td class="num"><strong x-text="row.rating.toFixed(2)"></strong></td>
                <td class="num hide-sm" x-text="row.mu.toFixed(2)"></td>
                <td class="num hide-sm muted" x-text="row.sigma.toFixed(2)"></td>
              </tr>
            </template>
            <tr class="empty" x-show="data && !data.length"><td colspan="6">No active bots yet.</td></tr>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'bots'">
      <section>
        <h2>Bots</h2>
        <form class="box">
          <label>Status:
            <select :value="statusFilter" @change="statusFilter = $event.target.value; load()">
              <option value="">any</option>
              <option>active</option><option>pending</option><option>rejected</option><option>retired</option>
            </select>
          </label>
        </form>
        <table>
          <thead><tr><th class="num">ID</th><th>Name</th><th>Owner</th><th>Status</th><th class="hide-sm">Submitted</th></tr></thead>
          <tbody>
            <template x-for="bot in data ?? []" :key="bot.id">
              <tr>
                <td class="num"><a :href="'#/bots/' + bot.id" x-text="bot.id"></a></td>
                <td x-text="bot.name ?? '-'"></td>
                <td x-text="bot.username"></td>
                <td><span class="status" :class="bot.status" x-text="bot.status"></span></td>
                <td class="hide-sm muted" x-text="date(bot.created_at)"></td>
              </tr>
            </template>
            <tr class="empty" x-show="data && !data.length"><td colspan="5">No bots match.</td></tr>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'bot' && data">
      <section>
        <h2><span x-text="data.name ?? 'Bot #' + data.id"></span> <span class="status" :class="data.status" x-text="data.status"></span></h2>
        <dl>
          <dt>ID</dt><dd x-text="data.id"></dd>
          <dt>Owner</dt><dd x-text="data.username"></dd>
          <dt>Rating</dt><dd x-text="(data.mu - 3 * data.sigma).toFixed(2)"></dd>
          <dt>&mu; / &sigma;</dt><dd x-text="data.mu.toFixed(2) + ' / ' + data.sigma.toFixed(2)"></dd>
          <dt>Submitted</dt><dd x-text="date(data.created_at)"></dd>
        </dl>
        <template x-if="data.error">
          <div><h3>Check failed</h3><pre class="box error" x-text="data.error"></pre></div>
        </template>
      </section>
    </template>

    <template x-if="route === 'tournaments'">
      <section>
        <h2>Tournaments</h2>
        <table>
          <thead><tr><th class="num">ID</th><th>Started</th><th>Finished</th><th class="num">Hands/leg</th><th class="num">Matches</th></tr></thead>
          <tbody>
            <template x-for="t in data ?? []" :key="t.id">
              <tr>
                <td class="num"><a :href="'#/tournaments/' + t.id" x-text="t.id"></a></td>
                <td x-text="date(t.started_at)"></td>
                <td>
                  <span x-show="t.finished_at" x-text="date(t.finished_at)"></span>
                  <span class="status pending" x-show="!t.finished_at">running</span>
                </td>
                <td class="num" x-text="t.hands"></td>
                <td class="num" x-text="t.matches"></td>
              </tr>
            </template>
            <tr class="empty" x-show="data && !data.length"><td colspan="5">No tournaments have run yet.</td></tr>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'tournament' && data">
      <section>
        <h2>Tournament #<span x-text="data.id"></span></h2>
        <p class="lead">
          <span x-text="data.hands"></span> hands per leg &middot; seed <code x-text="data.seed"></code> &middot;
          started <span x-text="date(data.started_at)"></span>
        </p>
        <h3>Standings</h3>
        <table>
          <thead><tr><th class="num">#</th><th>Bot</th><th>Owner</th><th class="num">Score</th><th class="num">W</th><th class="num">L</th><th class="num hide-sm">Matches</th></tr></thead>
          <tbody>
            <template x-for="(s, i) in data.standings" :key="s.bot_id">
              <tr>
                <td class="num" x-text="i + 1"></td>
                <td><a :href="'#/bots/' + s.bot_id" x-text="s.name"></a></td>
                <td x-text="s.username"></td>
                <td class="num" :class="sign(s.score)" x-text="s.score"></td>
                <td class="num" x-text="s.wins"></td>
                <td class="num" x-text="s.losses"></td>
                <td class="num hide-sm" x-text="s.matches"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <h3>Matches</h3>
        <table>
          <thead><tr><th class="num">ID</th><th>Bot A</th><th>Bot B</th><th class="num">Score (A)</th></tr></thead>
          <tbody>
            <template x-for="m in data.matches" :key="m.id">
              <tr>
                <td class="num"><a :href="'#/matches/' + m.id" x-text="m.id"></a></td>
                <td x-text="m.bot_a_username + '/' + m.bot_a_name"></td>
                <td x-text="m.bot_b_username + '/' + m.bot_b_name"></td>
                <td class="num" :class="sign(m.score)" x-text="m.score"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'match' && data">
      <section>
        <h2>Match #<span x-text="data.id"></span></h2>
        <p class="lead">
          <a :href="'#/bots/' + data.bot_a" x-text="data.bot_a_username + '/' + data.bot_a_name"></a>
          vs
          <a :href="'#/bots/' + data.bot_b" x-text="data.bot_b_username + '/' + data.bot_b_name"></a>
          &middot; score <strong :class="sign(data.score)" x-text="data.score"></strong> for A
          &middot; <a :href="'#/tournaments/' + data.tournament_id">tournament #<span x-text="data.tournament_id"></span></a>
        </p>
        <table>
          <thead><tr><th class="num">Leg</th><th>Seat 0</th><th>Seat 1</th><th class="num">Chips</th><th class="num">Hands</th><th>Note</th></tr></thead>
          <tbody>
            <template x-for="(leg, i) in data.legs" :key="i">
              <tr>
                <td class="num" x-text="i + 1"></td>
                <td x-text="botLabel(leg.bots?.[0])"></td>
                <td x-text="botLabel(leg.bots?.[1])"></td>
                <td class="num" x-text="leg.deltas.join(' / ')"></td>
                <td class="num" x-text="leg.hands ?? '-'"></td>
                <td class="error" x-text="leg.error ? 'seat ' + leg.forfeit + ' forfeit: ' + leg.error : ''"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'submit'">
      <section>
        <h2>My bots</h2>
        <form class="box" @submit.prevent="upload($refs.file)">
          <p style="margin-top: 0">Upload a Python file defining <code>create_bot()</code>. It is checked in a sandbox against the built-in bots before going live; your previous active bot is retired.</p>
          <input type="file" accept=".py" x-ref="file" required>
          <button class="primary" :disabled="busy" x-text="busy ? 'Uploading…' : 'Submit bot'"></button>
        </form>
        <table>
          <thead><tr><th class="num">ID</th><th>Name</th><th>Status</th><th class="hide-sm">Submitted</th><th>Error</th></tr></thead>
          <tbody>
            <template x-for="bot in [...(data ?? [])].reverse()" :key="bot.id">
              <tr>
                <td class="num"><a :href="'#/bots/' + bot.id" x-text="bot.id"></a></td>
                <td x-text="bot.name ?? '-'"></td>
                <td><span class="status" :class="bot.status" x-text="bot.status"></span></td>
                <td class="hide-sm muted" x-text="date(bot.created_at)"></td>
                <td><pre class="error" x-text="bot.error ?? ''"></pre></td>
              </tr>
            </template>
            <tr class="empty" x-show="data && !data.length"><td colspan="5">You haven't submitted a bot yet.</td></tr>
          </tbody>
        </table>
      </section>
    </template>

    <template x-if="route === 'play'">
      <section>
        <h2>Play</h2>
        <template x-if="!game || game.status === 'over'">
          <form class="box" @submit.prevent="startGame()">
            <p class="notice" x-show="game?.status === 'over'">
              Game over after <span x-text="game?.hands"></span> hands &mdash;
              you <strong x-text="game?.stacks[0]"></strong>, opponent <strong x-text="game?.stacks[1]"></strong>
              <span x-show="game?.error" x-text="'(' + game?.error + ')'"></span>
            </p>
            <label>Opponent:
              <select x-model="opponent">
                <optgroup label="Built-in">
                  <option value="builtin:call">call</option>
                  <option value="builtin:random">random</option>
                  <option value="builtin:fold">fold</option>
                </optgroup>
                <optgroup label="Active bots">
                  <template x-for="bot in data ?? []" :key="bot.id">
                    <option :value="'bot:' + bot.id" x-text="bot.username + '/' + bot.name"></option>
                  </template>
                </optgroup>
              </select>
            </label>
            <button class="primary" :disabled="busy">Start game</button>
          </form>
        </template>

        <template x-if="game && game.status !== 'over'">
          <div>
            <p>
              vs <strong x-text="game.opponent"></strong>
              &middot; hand <span x-text="game.hands + 1"></span> of <span x-text="game.max_hands"></span>
              &middot; <a href="#" @click.prevent="quitGame()">quit</a>
            </p>
            <p class="notice" x-show="game.status === 'starting'">Starting opponent&hellip;</p>

            <template x-if="game.observation">
              <div>
                <div class="felt">
                  <div class="seat">
                    <span class="card back">??</span><span class="card back">??</span><br>
                    opponent &middot; <strong x-text="obs.stacks[1]"></strong> chips
                    <span class="tag" x-show="obs.button === 1">D</span>
                    <span x-show="obs.street_bets[1]">&middot; bet <span x-text="obs.street_bets[1]"></span></span>
                    <em x-show="game.status === 'thinking'">&middot; thinking&hellip;</em>
                  </div>
                  <div class="board">
                    <template x-for="c in obs.board"><span class="card" :class="suitClass(c)" x-text="card(c)"></span></template>
                    <span class="pot">pot <span x-text="obs.pot"></span> &middot; <span x-text="obs.street"></span></span>
                  </div>
                  <div class="seat">
                    <template x-for="c in obs.hole"><span class="card" :class="suitClass(c)" x-text="card(c)"></span></template><br>
                    you &middot; <strong x-text="obs.stacks[0]"></strong> chips
                    <span class="tag" x-show="obs.button === 0">D</span>
                    <span x-show="obs.street_bets[0]">&middot; bet <span x-text="obs.street_bets[0]"></span></span>
                  </div>
                </div>
                <div class="actions">
                  <button @click="act('fold')">Fold</button>
                  <button x-show="obs.can_check" @click="act('check')">Check</button>
                  <button x-show="!obs.can_check" @click="act('call')" x-text="'Call ' + obs.to_call"></button>
                  <template x-if="obs.can_raise">
                    <span class="actions">
                      <input type="range" :min="obs.min_raise_to" :max="obs.max_raise_to" :step="obs.bb / 2" x-model.number="raiseTo">
                      <input type="number" :min="obs.min_raise_to" :max="obs.max_raise_to" x-model.number="raiseTo">
                      <button class="primary" @click="act('raise', raiseTo)" x-text="'Raise to ' + raiseTo"></button>
                    </span>
                  </template>
                </div>
                <ol class="history">
                  <template x-for="h in obs.history">
                    <li x-text="h.street + ': ' + (h.seat === 0 ? 'you' : 'opponent') + ' ' + h.type + (h.amount ? ' ' + h.amount : '')"></li>
                  </template>
                </ol>
              </div>
            </template>
          </div>
        </template>

        <template x-if="game?.recent_hands?.length">
          <h3>Recent hands</h3>
        </template>
        <template x-for="(hand, i) in game?.recent_hands ?? []" :key="i">
          <div class="last-hand">
            <p>
              <strong x-text="'#' + (game.hands - game.recent_hands.length + i + 1)"></strong>
              <span :class="sign(hand.deltas[0])" x-text="handSummary(hand)"></span>
            </p>
            <p class="cards">
              you
              <template x-for="c in hand.holes[0]"><span class="card" :class="suitClass(c)" x-text="card(c)"></span></template>
              &middot; opponent
              <template x-for="c in hand.holes[1] ?? ['??', '??']"><span class="card" :class="suitClass(c)" x-text="card(c)"></span></template>
              &middot; board
              <template x-for="c in hand.board"><span class="card" :class="suitClass(c)" x-text="card(c)"></span></template>
            </p>
          </div>
        </template>
      </section>
    </template>
  </div>

  <div id="footer">
    poker-arena &middot; bots run in sandboxed containers &middot;
    <a href="https://github.com/azimab/poker_arena">source on GitHub</a>
  </div>
</body>
</html>
